<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Target FY 27 — Excel-formler & Kopplingar</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --bg-deep: #000205;
        }

        body {
            background-color: var(--bg-deep);
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px; min-height: 100vh;
        }

        .container { max-width: 100%; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-weight: 600; font-size: 22px; color: #fff; margin: 0; }
        .header p { font-size: 12px; color: #86868b; margin: 5px 0 0 0; }

        .table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px;
            overflow-x: hidden;
        }

        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; table-layout: fixed; }
        
        th { 
            background: rgba(10, 17, 26, 0.95);
            color: var(--accent-blue); padding: 8px 4px; font-weight: 700;
            border-bottom: 1px solid var(--glass-border); text-align: right;
        }
        th:first-child { text-align: left; width: 150px; }

        td { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #ccc; text-align: right; }
        td:first-child { text-align: left; font-weight: 600; color: #fff; }

        td input { 
            width: 100%; box-sizing: border-box; padding: 4px 2px; font-size: 11px; 
            text-align: right; background: rgba(0, 0, 0, 0.4); color: #fff; 
            border: 1px solid var(--glass-border); border-radius: 6px; 
        }

        .row-calc { background: rgba(0, 122, 255, 0.04); font-weight: 600; color: #70b0ff; }
        .row-total { background: rgba(0, 122, 255, 0.1); font-weight: 700; color: #fff; border-top: 2px solid var(--accent-blue); }

        .actions { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .status-msg { font-size: 11px; color: var(--accent-green); font-weight: bold; }

        .btn-save {
            background: var(--accent-blue); color: #fff; border: none;
            padding: 10px 24px; border-radius: 10px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; font-size: 12px;
        }
        .btn-save:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Target FY 27 — Modell med Excel-kopplingar</h1>
        <p>Ändra grunddata (Intäkter, Råvaror, Personal, Övrigt) – alla procentsatser, PI och Gross Profit räknas automatiskt ut via formler.</p>
    </div>

    <div class="table-container">
        <table id="target-table">
            <thead>
                <tr>
                    <th>Target FY 27</th>
                    <th>Sep</th><th>Okt</th><th>Nov</th><th>Dec</th><th>Jan</th><th>Feb</th>
                    <th>Mar</th><th>Apr</th><th>Maj</th><th>Jun</th><th>Jul</th><th>Aug</th>
                    <th style="color: #fff;">Total year</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="actions">
        <span id="save-status" class="status-msg"></span>
        <button class="btn-save" onclick="saveTarget()">Spara Ändringar</button>
    </div>
</div>

<script>
    const months = ["Sep", "Okt", "Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "Maj", "Jun", "Jul", "Aug"];
    
    // Grunddata som du kan skriva in fritt (Inputs)
    let baseData = JSON.parse(localStorage.getItem('master_target_base')) || {
        "Intäkter": [4854040, 3945205, 4660067, 3294763, 2841501, 3690804, 2707296, 3873455, 3315648, 1813615, 349638, 2051865],
        "Råvarukostnad": [-2233650, -1811996, -2144484, -1512655, -1306861, -1699330, -1240964, -1779850, -1526609, -828926, -154495, -941430],
        "Personalkostnader": [-1061611, -1061611, -1061611, -1071611, -893501, -893501, -893501, -891501, -901501, -891501, -35429, -891501],
        "Övriga kostnader": [-824160, -792030, -793560, -776730, -808860, -756330, -757860, -756330, -788460, -756330, -258570, -757860]
    };

    const fmt = new Intl.NumberFormat('sv-SE', { maximumFractionDigits: 0 });
    const fmtPct = (val) => (val * 100).toFixed(1).replace('.', ',') + ' %';

    function renderTable() {
        const tbody = document.querySelector('#target-table tbody');
        tbody.innerHTML = '';

        let intäkter = baseData["Intäkter"];
        let råvaror = baseData["Råvarukostnad"];
        let personal = baseData["Personalkostnader"];
        let övrigt = baseData["Övriga kostnader"];

        // 1. Intäkter (Inmatning)
        tbody.appendChild(createInputRow("Intäkter", intäkter));

        // 2. Råvarukostnad (Inmatning)
        tbody.appendChild(createInputRow("Råvarukostnad", råvaror));

        // 3. Råvarukostnad % -> Formel: (Råvarukostnad / Intäkter) * 100
        let rawPct = intäkter.map((v, i) => v !== 0 ? (råvaror[i] / v) : 0);
        tbody.appendChild(createCalcRow("Råvarukostnad %", rawPct, true));

        // 4. Personalkostnader (Inmatning)
        tbody.appendChild(createInputRow("Personalkostnader", personal));

        // 5. Personalkostnad % -> Formel: (Personalkostnader / Intäkter) * 100
        let persPct = intäkter.map((v, i) => v !== 0 ? (personal[i] / v) : 0);
        tbody.appendChild(createCalcRow("Personalkostnad %", persPct, true));

        // 6. Övriga kostnader (Inmatning)
        tbody.appendChild(createInputRow("Övriga kostnader", övrigt));

        // 7. Övriga kostnader % -> Formel: (Övriga kostnader / Intäkter) * 100
        let övrPct = intäkter.map((v, i) => v !== 0 ? (övrigt[i] / v) : 0);
        tbody.appendChild(createCalcRow("Övriga kostnader %", övrPct, true));

        // 8. PI -> Formel: Intäkter + Råvarukostnad
        let pi = intäkter.map((v, i) => v + råvaror[i]);
        tbody.appendChild(createCalcRow("PI", pi, false));

        // 9. PI% -> Formel: PI / Intäkter
        let piPct = intäkter.map((v, i) => v !== 0 ? (pi[i] / v) : 0);
        tbody.appendChild(createCalcRow("PI%", piPct, true));

        // 10. Gross Profit -> Formel: PI + Personalkostnader + Övriga kostnader
        let gp = intäkter.map((v, i) => pi[i] + personal[i] + övrigt[i]);
        tbody.appendChild(createCalcRow("Gross Profit", gp, false, true));

        // 11. Gross Margin -> Formel: Gross Profit / Intäkter
        let gpPct = intäkter.map((v, i) => v !== 0 ? (gp[i] / v) : 0);
        tbody.appendChild(createCalcRow("Gross Margin", gpPct, true, true));
    }

    function createInputRow(label, arr) {
        let tr = document.createElement('tr');
        let html = `<td>${label}</td>`;
        let total = arr.reduce((a, b) => a + b, 0);

        arr.forEach((val, idx) => {
            html += `<td><input type="number" step="any" data-row="${label}" data-col="${idx}" value="${val}" oninput="liveUpdate()"></td>`;
        });
        html += `<td style="font-weight: 700; color: #fff; text-align: right;" id="tot-${label}">${fmt.format(total)}</td>`;
        tr.innerHTML = html;
        return tr;
    }

    function createCalcRow(label, arr, isPct, isTotalRow) {
        let tr = document.createElement('tr');
        if (isTotalRow) tr.className = 'row-total';
        else tr.className = 'row-calc';

        let html = `<td>${label}</td>`;
        let totalVal = arr.reduce((a, b) => a + b, 0);
        
        // För procentsatser räknar vi ut totalår som total summa delat på totala intäkter (eller medelvärde)
        if (isPct) {
            let intäkterTot = baseData["Intäkter"].reduce((a, b) => a + b, 0);
            let partTot = 0;
            if (label.includes('Råvarukostnad')) partTot = baseData["Råvarukostnad"].reduce((a, b) => a + b, 0);
            if (label.includes('Personalkostnad')) partTot = baseData["Personalkostnad"].reduce((a, b) => a + b, 0) || baseData["Personalkostnader"].reduce((a, b) => a + b, 0);
            if (label.includes('Övriga kostnader')) partTot = baseData["Övriga kostnader"].reduce((a, b) => a + b, 0);
            if (label.includes('PI%')) {
                let piArr = baseData["Intäkter"].map((v, i) => v + baseData["Råvarukostnad"][i]);
                partTot = piArr.reduce((a, b) => a + b, 0);
            }
            if (label.includes('Gross Margin')) {
                let piArr = baseData["Intäkter"].map((v, i) => v + baseData["Råvarukostnad"][i]);
                let gpArr = baseData["Intäkter"].map((v, i) => piArr[i] + baseData["Personalkostnader"][i] + baseData["Övriga kostnader"][i]);
                partTot = gpArr.reduce((a, b) => a + b, 0);
            }
            totalVal = intäkterTot !== 0 ? (partTot / intäkterTot) : 0;
        }

        arr.forEach(val => {
            html += `<td style="text-align: right;">${isPct ? fmtPct(val) : fmt.format(val)}</td>`;
        });
        html += `<td style="text-align: right;">${isPct ? fmtPct(totalVal) : fmt.format(totalVal)}</td>`;
        tr.innerHTML = html;
        return tr;
    }

    function liveUpdate() {
        const inputs = document.querySelectorAll('#target-table input');
        inputs.forEach(input => {
            let row = input.getAttribute('data-row');
            let col = parseInt(input.getAttribute('data-col'));
            baseData[row][col] = parseFloat(input.value) || 0;
        });
        renderTable(); // Räknar om alla formler och kopplingar direkt i realtid
    }

    function saveTarget() {
        localStorage.setItem('master_target_base', JSON.stringify(baseData));
        document.getElementById('save-status').innerText = "✓ Sparat i webbläsaren!";
        setTimeout(() => { document.getElementById('save-status').innerText = ""; }, 3000);
    }

    renderTable();
</script>
</body>
</html>
