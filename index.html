<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Financial Dashboard — FY 27</title>
    <!-- SheetJS för att läsa Excel-filer direkt i webbläsaren -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --accent-orange: #ff9500;
            --bg-deep: #000205;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% -20%, #1a2a44 0%, var(--bg-deep) 70%);
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 30px 20px; min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--glass-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); padding: 15px 25px;
            border-radius: 16px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
        }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--accent-green); font-weight: 600; }
        .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }

        .upload-section { display: flex; align-items: center; gap: 10px; }
        .upload-btn {
            background: var(--accent-blue); color: #fff; border: none;
            padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 12px;
        }
        .upload-btn:hover { opacity: 0.8; }
        #excel-file { display: none; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { 
            font-weight: 600; font-size: 24px;
            background: linear-gradient(to bottom, #fff 0%, #a1a1a6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;
        }
        .header p { color: #86868b; font-size: 12px; margin-top: 5px; }

        .table-container {
            background: var(--glass-bg); backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 15px; overflow-x: auto; margin-bottom: 25px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; white-space: nowrap; }
        th { 
            position: sticky; top: 0; background: rgba(10, 17, 26, 0.95);
            color: var(--accent-blue); padding: 12px 8px; font-weight: 700;
            border-bottom: 1px solid var(--glass-border); text-align: right;
        }
        th:first-child { text-align: left; }
        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #ccc; text-align: right; }
        td:first-child { text-align: left; font-weight: 600; color: #fff; }
        
        .placeholder-msg { text-align: center; padding: 40px; color: #86868b; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>DASHBOARD REDO</span>
        </div>
        <div class="upload-section">
            <label for="excel-file" class="upload-btn">📁 Välj Excel-fil (.xlsx)</label>
            <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)">
        </div>
    </div>

    <div class="header">
        <h1>Finansiell Dashboard — Target, Utfall & Diff</h1>
        <p>Ladda upp uppdragets Excel-fil för att direkt generera gränssnittet</p>
    </div>

    <div class="table-container" id="table-wrapper">
        <div class="placeholder-msg">Ingen Excel-fil inladdad ännu. Klicka på "Välj Excel-fil" ovan för att börja.</div>
    </div>
</div>

<script>
    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });

            // Ta första bladet i Excel-filen
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];

            // Gör om bladet till en HTML-tabell
            const htmlTable = XLSX.utils.sheet_to_html(worksheet, { header: "" });

            // Rendera ut i containern
            const wrapper = document.getElementById('table-wrapper');
            wrapper.innerHTML = htmlTable;

            // Anpassa tabellens klasser för vår snygga mörka design
            const table = wrapper.querySelector('table');
            if (table) {
                table.id = "excel-rendered-table";
            }
        };
        reader.readAsArrayBuffer(file);
    }
</script>

</body>
</html>
