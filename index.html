<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Financial Dashboard — FY 27</title>
    <!-- SheetJS för att läsa Excel-filer -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --bg-deep: #000205;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% -20%, #1a2a44 0%, var(--bg-deep) 70%);
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 30px 20px; min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--glass-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); padding: 15px 25px;
            border-radius: 16px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
        }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--accent-green); font-weight: 600; }
        .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }

        .controls { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .upload-btn {
            background: var(--accent-blue); color: #fff; border: none;
            padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px;
        }
        .upload-btn:hover { opacity: 0.8; }
        #excel-file { display: none; }

        select {
            background: rgba(0, 0, 0, 0.6); color: #fff; border: 1px solid var(--glass-border);
            padding: 10px 14px; border-radius: 10px; font-size: 13px; outline: none; cursor: pointer;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { 
            font-weight: 600; font-size: 24px;
            background: linear-gradient(to bottom, #fff 0%, #a1a1a6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;
        }
        .header p { color: #86868b; font-size: 12px; margin-top: 5px; }

        .table-container {
            background: var(--glass-bg); backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 20px; overflow-x: auto; margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Snygg stil på tabellen som genereras */
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; white-space: nowrap; }
        th { 
            position: sticky; top: 0; background: rgba(10, 17, 26, 0.95);
            color: var(--accent-blue); padding: 14px 10px; font-weight: 700;
            border-bottom: 1px solid var(--glass-border); text-align: right;
        }
        th:first-child { text-align: left; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #ddd; text-align: right; }
        td:first-child { text-align: left; font-weight: 600; color: #fff; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .placeholder-msg { text-align: center; padding: 60px; color: #86868b; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span id="status-text">VÄNTAR PÅ EXCEL-FIL</span>
        </div>
        <div class="controls">
            <select id="sheet-select" style="display:none;" onchange="switchSheet()">
                <option value="">Välj tabellvy...</option>
            </select>
            <label for="excel-file" class="upload-btn">📁 Välj Excel-fil (.xlsx)</label>
            <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)">
        </div>
    </div>

    <div class="header">
        <h1>Finansiell Dashboard</h1>
        <p>Välj vy och analysera uppdragets nyckeltal</p>
    </div>

    <div class="table-container" id="table-wrapper">
        <div class="placeholder-msg">Ingen Excel-fil inladdad ännu. Klicka på "Välj Excel-fil" för att börja.</div>
    </div>
</div>

<script>
    let loadedWorkbook = null;

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            loadedWorkbook = XLSX.read(data, { type: 'array', cellFormula: false, cellText: true });

            const sheetSelect = document.getElementById('sheet-select');
            sheetSelect.innerHTML = '<option value="">Välj tabellvy...</option>';
            
            loadedWorkbook.SheetNames.forEach(name => {
                // Filtrera bort dolda/hjälp-blad om vi vill hålla det rent
                if (name !== 'dropdowns') {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    sheetSelect.appendChild(opt);
                }
            });

            sheetSelect.style.display = 'inline-block';
            document.getElementById('status-text').textContent = 'FIL INLADDAD';

            // Välj första synliga bladet som standard
            const visibleSheets = loadedWorkbook.SheetNames.filter(n => n !== 'dropdowns');
            if (visibleSheets.length > 0) {
                sheetSelect.value = visibleSheets[0];
                switchSheet();
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function switchSheet() {
        const sheetName = document.getElementById('sheet-select').value;
        if (!sheetName || !loadedWorkbook) return;

        const worksheet = loadedWorkbook.Sheets[sheetName];
        const htmlTable = XLSX.utils.sheet_to_html(worksheet, { header: "" });

        const wrapper = document.getElementById('table-wrapper');
        wrapper.innerHTML = htmlTable;
    }
</script>

</body>
</html>
