<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Target FY 27 — Fullt Redigerbar Modell</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --bg-deep: #000205;
        }

        body {
            background-color: var(--bg-deep);
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px; min-height: 100vh;
        }

        .container { max-width: 100%; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-weight: 600; font-size: 22px; color: #fff; margin: 0; }

        .table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px;
            overflow-x: hidden;
        }

        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; table-layout: fixed; }
        
        th { 
            background: rgba(10, 17, 26, 0.95);
            color: var(--accent-blue); padding: 8px 4px; font-weight: 700;
            border-bottom: 1px solid var(--glass-border); text-align: right;
            overflow: hidden; text-overflow: ellipsis;
        }
        th:first-child { text-align: left; width: 140px; }

        td { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #ccc; text-align: right; overflow: hidden; }
        td:first-child { text-align: left; font-weight: 600; color: #fff; }

        td input { 
            width: 100%; box-sizing: border-box; padding: 4px 2px; font-size: 11px; 
            text-align: right; background: rgba(0, 0, 0, 0.4); color: #fff; 
            border: 1px solid var(--glass-border); border-radius: 6px; 
        }

        .row-total { background: rgba(0, 122, 255, 0.08); font-weight: 700; color: #fff; border-top: 2px solid var(--accent-blue); }

        .actions { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .status-msg { font-size: 11px; color: var(--accent-green); font-weight: bold; }

        .btn-save {
            background: var(--accent-blue); color: #fff; border: none;
            padding: 10px 24px; border-radius: 10px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; font-size: 12px;
        }
        .btn-save:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>Target FY 27 — Fullt Redigerbar Modell</h1></div>

    <div class="table-container">
        <table id="target-table">
            <thead>
                <tr>
                    <th>Target FY 27</th>
                    <th>Sep</th><th>Okt</th><th>Nov</th><th>Dec</th><th>Jan</th><th>Feb</th>
                    <th>Mar</th><th>Apr</th><th>Maj</th><th>Jun</th><th>Jul</th><th>Aug</th>
                    <th style="color: #fff;">Total year</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="actions">
        <span id="save-status" class="status-msg"></span>
        <button class="btn-save" onclick="saveTarget()">Spara Ändringar</button>
    </div>
</div>

<script>
    const months = ["Sep", "Okt", "Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "Maj", "Jun", "Jul", "Aug"];
    
    // Samtliga rader är nu fullt redigerbara precis som i din Excel-fil
    let targetData = JSON.parse(localStorage.getItem('master_target_fy27_editable')) || {
        "Intäkter": [4854040, 3945205, 4660067, 3294763, 2841501, 3690804, 2707296, 3873455, 3315648, 1813615, 349638, 2051865],
        "Råvarukostnad": [-2233650, -1811996, -2144484, -1512655, -1306861, -1699330, -1240964, -1779850, -1526609, -828926, -154495, -941430],
        "Råvarukostnad %": [-46.0, -45.9, -46.0, -45.9, -46.0, -46.0, -45.8, -45.9, -46.0, -45.7, -44.2, -45.9],
        "Personalkostnader": [-1061611, -1061611, -1061611, -1071611, -893501, -893501, -893501, -891501, -901501, -891501, -35429, -891501],
        "Personalkostnad %": [-21.9, -26.9, -22.8, -32.5, -31.4, -24.2, -33.0, -23.0, -27.2, -49.2, -10.1, -43.4],
        "Övriga kostnader": [-824160, -792030, -793560, -776730, -808860, -756330, -757860, -756330, -788460, -756330, -258570, -757860],
        "Övriga kostnader %": [-17.0, -20.1, -17.0, -23.6, -28.5, -20.5, -28.0, -19.5, -23.8, -41.7, -74.0, -36.9],
        "PI": [2620390, 2133209, 2515583, 1782108, 1534640, 1991474, 1466332, 2093605, 1789039, 984689, 195143, 1110435],
        "PI%": [54.0, 54.1, 54.0, 54.1, 54.0, 54.0, 54.2, 54.1, 54.0, 54.3, 55.8, 54.1],
        "Gross Profit": [734619, 279568, 660412, -66233, -167721, 341643, -185029, 445774, 99078, -663142, -98856, -538926],
        "Gross Margin": [15.1, 7.1, 14.2, -2.0, -5.9, 9.3, -6.8, 11.5, 3.0, -36.6, -28.3, -26.3]
    };

    const fmt = new Intl.NumberFormat('sv-SE', { maximumFractionDigits: 0 });

    function renderTable() {
        const tbody = document.querySelector('#target-table tbody');
        tbody.innerHTML = '';

        for (let rowName in targetData) {
            let tr = document.createElement('tr');
            let isTotal = (rowName === "Gross Profit" || rowName === "Gross Margin");
            if (isTotal) tr.className = 'row-total';

            let html = `<td>${rowName}</td>`;
            let arr = targetData[rowName];
            
            // Summera totalt för året (för procentrader räknar vi ut ett snitt eller summa beroende på typ, här summerar vi eller visar total)
            let totalVal = arr.reduce((a, b) => a + b, 0);
            if (rowName.includes('%') || rowName === "Gross Margin") {
                totalVal = arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
            }

            arr.forEach((val, idx) => {
                let displayVal = rowName.includes('%') || rowName === "Gross Margin" ? val.toFixed(1).replace('.', ',') + ' %' : val;
                html += `<td><input type="number" step="any" data-row="${rowName}" data-col="${idx}" value="${val}" oninput="liveUpdate()"></td>`;
            });

            let displayTotal = rowName.includes('%') || rowName === "Gross Margin" ? totalVal.toFixed(1).replace('.', ',') + ' %' : fmt.format(totalVal);
            html += `<td style="font-weight: 700; color: #fff; text-align: right;" id="tot-${rowName}">${displayTotal}</td>`;
            
            tr.innerHTML = html;
            tbody.appendChild(tr);
        }
    }

    function liveUpdate() {
        const inputs = document.querySelectorAll('#target-table input');
        inputs.forEach(input => {
            let row = input.getAttribute('data-row');
            let col = parseInt(input.getAttribute('data-col'));
            targetData[row][col] = parseFloat(input.value) || 0;
        });

        // Uppdatera totalåret dynamiskt direkt i tabellen när man skriver
        for (let rowName in targetData) {
            let arr = targetData[rowName];
            let totalVal = arr.reduce((a, b) => a + b, 0);
            if (rowName.includes('%') || rowName === "Gross Margin") {
                totalVal = arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
            }
            let totCell = document.getElementById(`tot-${rowName}`);
            if (totCell) {
                totCell.innerText = rowName.includes('%') || rowName === "Gross Margin" ? totalVal.toFixed(1).replace('.', ',') + ' %' : fmt.format(totalVal);
            }
        }
    }

    function saveTarget() {
        localStorage.setItem('master_target_fy27_editable', JSON.stringify(targetData));
        document.getElementById('save-status').innerText = "✓ Sparat i webbläsaren!";
        setTimeout(() => { document.getElementById('save-status').innerText = ""; }, 3000);
    }

    renderTable();
</script>
</body>
</html>
