<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Utfall & Verklighet v12.2</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --accent-orange: #ff9500;
            --bg-deep: #000205;
        }
        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% -20%, #1a2a44 0%, var(--bg-deep) 70%);
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 40px 20px; min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .view-switcher { display: flex; justify-content: center; margin-bottom: 40px; }
        .segmented-control {
            background: rgba(255, 255, 255, 0.05); padding: 4px; border-radius: 14px;
            display: flex; gap: 4px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px);
        }
        .segment-btn {
            background: transparent; color: #86868b; border: none; padding: 8px 24px;
            border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .segment-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; background: linear-gradient(to bottom, #fff 0%, #a1a1a6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .controls-glass {
            background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            padding: 20px 24px; border-radius: 24px; display: grid; grid-template-columns: 1fr 2fr;
            gap: 30px; align-items: center; margin-bottom: 40px;
        }
        .upload-btn { background: rgba(0, 122, 255, 0.15); color: var(--accent-blue); padding: 12px 28px; border-radius: 14px; cursor: pointer; border: 1px solid rgba(0, 122, 255, 0.3); text-transform: uppercase; }
        input[type="file"] { display: none; }
        .liquid-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px; }
        .liquid-card { background: var(--glass-bg); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); padding: 35px 20px; border-radius: 28px; text-align: center; }
        .val-display { font-size: 34px; font-weight: 700; color: #fff; }
        .status-positive .val-display { color: var(--accent-green); }
        .status-negative .val-display { color: var(--accent-orange); }
        .table-container { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 20px; border-radius: 24px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--accent-blue); padding: 15px; border-bottom: 1px solid var(--glass-border); }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
<div class="container">
    <div class="view-switcher">
        <div class="segmented-control">
            <button class="segment-btn active" onclick="switchView('dashboard')">Dashboard</button>
            <button class="segment-btn" onclick="switchView('data')">Affärsdata</button>
        </div>
    </div>
    <div class="header"><h1>Utfall & Verklighet 2026</h1></div>
    <div class="controls-glass">
        <div>
            <label for="excel-upload" class="upload-btn">Välj Affärsdata</label>
            <input type="file" id="excel-upload" accept=".xlsx, .xlsm">
            <span id="sync-status" style="margin-left:15px; font-weight:bold;">VÄNTAR...</span>
        </div>
        <div class="select-group">
            <select id="cust-select"><option value="ALLA">Hela Portföljen</option></select>
            <select id="month-select">
                <option value="Nov" selected>November</option><option value="Dec">December</option>
            </select>
        </div>
    </div>
    <div id="dashboard-view">
        <div class="row-header">Månadsfokus</div>
        <div class="liquid-grid">
            <div class="liquid-card"><div class="val-label">Intäkt</div><div class="val-display" id="m-inc">0 kr</div></div>
            <div class="liquid-card"><div class="val-label">Sant Mål</div><div class="val-display" id="m-optar">0 kr</div></div>
            <div class="liquid-card" id="m-diff-c"><div class="val-label">Diff</div><div class="val-display" id="m-diff">0 kr</div></div>
        </div>
        <div class="row-header">Helårsfokus</div>
        <div class="liquid-grid">
            <div class="liquid-card"><div class="val-label">Intäkt YTD</div><div class="val-display" id="y-inc">0 kr</div></div>
            <div class="liquid-card"><div class="val-label">Mål YTD</div><div class="val-display" id="y-optar">0 kr</div></div>
            <div class="liquid-card" id="y-diff-c"><div class="val-label">Diff YTD</div><div class="val-display" id="y-diff">0 kr</div></div>
        </div>
    </div>
    <div id="data-view" class="table-container">
        <table id="data-table"><thead><tr><th>Kund</th><th>Månad</th><th>Utfall</th><th>Target</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
    let rawData = [];
    const fmt = new Intl.NumberFormat('sv-SE', { style: 'currency', currency: 'SEK', maximumFractionDigits: 0 });
    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('sodexo_dashboard_data');
        if (saved) { rawData = JSON.parse(saved); initDropdowns(); updateUI(); document.getElementById('sync-status').innerText = "● LIVE (SPARAD)"; }
    });
    function switchView(view) {
        document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('dashboard-view').style.display = (view === 'dashboard' ? 'block' : 'none');
        document.getElementById('data-view').style.display = (view === 'data' ? 'block' : 'none');
    }
    function parseV(val) { let n = parseFloat(val?.toString().replace(/\s/g, '').replace('kr', '').replace(',', '.')); return isNaN(n) ? 0 : n; }
    function getCol(row, pattern) { for (let key in row) if (key.toLowerCase().trim().includes(pattern.toLowerCase())) return row[key]; return null; }
    function initDropdowns() {
        const custS = document.getElementById('cust-select');
        custS.innerHTML = '<option value="ALLA">Hela Portföljen</option>';
        [...new Set(rawData.map(r => getCol(r, 'kund')))].filter(k => k).sort().forEach(k => {
            const opt = document.createElement('option'); opt.value = k; opt.text = k; custS.appendChild(opt);
        });
    }
    document.getElementById('excel-upload').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (evt) => {
            const workbook = XLSX.read(new Uint8Array(evt.target.result), {type: 'array'});
            rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            localStorage.setItem('sodexo_dashboard_data', JSON.stringify(rawData));
            initDropdowns(); updateUI(); document.getElementById('sync-status').innerText = "● LIVE (SPARAD)";
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });
    function updateUI() {
        const cust = document.getElementById('cust-select').value;
        const mon = document.getElementById('month-select').value;
        const mData = (cust === 'ALLA' ? rawData : rawData.filter(r => getCol(r, 'kund') === cust)).filter(r => getCol(r, 'månad') === mon);
        const yData = (cust === 'ALLA' ? rawData : rawData.filter(r => getCol(r, 'kund') === cust));
        const calc = (rows) => { let inc=0, tar=0; rows.forEach(r => { inc+=parseV(getCol(r,'utfall')); tar+=parseV(getCol(r,'target')); }); return {inc, tar, diff: inc-tar}; };
        const m = calc(mData); const y = calc(yData);
        document.getElementById('m-inc').innerText = fmt.format(m.inc); document.getElementById('m-optar').innerText = fmt.format(m.tar);
        document.getElementById('m-diff').innerText = fmt.format(m.diff); document.getElementById('m-diff-c').className = 'liquid-card ' + (m.diff >= 0 ? 'status-positive' : 'status-negative');
        document.getElementById('y-inc').innerText = fmt.format(y.inc); document.getElementById('y-optar').innerText = fmt.format(y.tar);
        document.getElementById('y-diff').innerText = fmt.format(y.diff); document.getElementById('y-diff-c').className = 'liquid-card ' + (y.diff >= 0 ? 'status-positive' : 'status-negative');
    }
    document.getElementById('cust-select').addEventListener('change', updateUI);
</script>
</body>
</html>
